name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
      - dev
      - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REPOSITORY: rentokil-uni-registry
  ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

jobs:
  # --- JOB 1: CODE QUALITY & SECURITY SCAN ---
  quality-check:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'test_secret_key_for_ci_only' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks needs history to scan for leaked secrets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pytest mypy httpx bandit safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi


      # --- SECURITY EXTRA 1: Secret Scanning ---
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- SECURITY EXTRA 2: SAST (Bandit) ---
      - name: Security Lint (Bandit)
        run: bandit -r . -x ./tests -ll # Skips tests, reports Med/High issues

      # --- SECURITY EXTRA 3: SCA (Safety) --- This would fail if a new vulnerabilty appears after submission.
      #- name: Dependency Check (Safety)
      #  run: safety check

      - name: Lint with Pylint
        run: |
          pylint --fail-under=7.0 main.py routers/ services/ repository/ dependencies/ models/ tests/



      - name: Type Check (Mypy)
        run: mypy . --ignore-missing-imports

      - name: Run Unit Tests
        run: |
          python -m pytest -m unit --cov=. --cov-report=xml

      - name: Run E2E Tests
        run: |
          python -m pytest -m e2e --cov=. --cov-append --cov-report=xml --cov-report=term-missing


  # --- JOB 2: CONTAINER SECURITY (Trivy) ---
  container-security:
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Local Image for Scanning
        run: docker build -t local-scan-target:${{ github.sha }} .

      # --- SECURITY EXTRA 4: Container Scanning ---
      - name: Scan Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-scan-target:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fails the build if vulnerabilities are found
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # --- JOB 3: DEPLOYMENT ---
  deploy:
    runs-on: ubuntu-latest
    needs: [quality-check, container-security] # Must pass both code and container checks
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Authorize Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          SERVICE_NAME="rentokil-backend-uni-${{ env.ENV_NAME }}"
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${SERVICE_NAME}:${{ github.sha }}"
          
          docker build -t "$IMAGE_TAG" . 
          docker push "$IMAGE_TAG"

      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: rentokil-backend-uni-${{ env.ENV_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/rentokil-backend-uni-${{ env.ENV_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            DATABASE_URL=sqlite:///app.db
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            ENVIRONMENT=${{ env.ENV_NAME }}