name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
      - dev
      - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REPOSITORY: rentokil-uni-registry
  ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

jobs:
  # --- JOB 1: CODE QUALITY & TESTING ---
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up subsequent runs by caching dependencies

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest mypy httpx  # httpx is recommended for FastAPI testing
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint and Format Check (Ruff)
        run: |
          # 'check' looks for bugs; 'format --check' ensures code style is consistent
          ruff check .
          ruff format --check .

      - name: Type Check (Mypy)
        run: mypy . --ignore-missing-imports

      - name: Run Tests (Pytest)
        run: pytest

  # --- JOB 2: DEPLOYMENT ---
  deploy:
    runs-on: ubuntu-latest
    needs: quality-check # This ensures deploy only runs if quality-check passes
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Authorize Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          SERVICE_NAME="rentokil-backend-uni-${{ env.ENV_NAME }}"
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${SERVICE_NAME}:${{ github.sha }}"
          
          docker build -t "$IMAGE_TAG" . 
          docker push "$IMAGE_TAG"

      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: rentokil-backend-uni-${{ env.ENV_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/rentokil-backend-uni-${{ env.ENV_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            DATABASE_URL=sqlite:///./app.db
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}